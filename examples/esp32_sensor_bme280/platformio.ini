; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_v2]
# Pin platform and framework to known good versions for reproducible builds.
# Update these pins when you test and certify new PlatformIO versions.
platform = espressif32@3.5.0
board = heltec_wifi_lora_32_v2
framework = arduino
monitor_speed = 115200
src_dir = ../../src
lib_deps =
	https://github.com/nanopb/nanopb.git#0.4.7
	adafruit/Adafruit BME280 Library@2.2.2
	adafruit/Adafruit Unified Sensor@1.1.15
lib_extra_dirs =
    ../../lib
build_flags = 
	-D HELTEC_LORA_V2
	-D APP_VERSION=\"0.0.0\"
	-D HW_VENDOR=\"generic\"
	-I../../src
	-I../../src/generated_proto
